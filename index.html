<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Point - Smart Printer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .printer-card { background: white; width: 450px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 6px solid #28a745; }
        .header-info { background: #f8f9fa; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; border: 1px dashed #ccc; text-align: center; color: #333; }
        h2 { margin-top: 0; color: #333; text-align: center; }
        textarea { width: 100%; height: 120px; border: 1px solid #ddd; border-radius: 8px; padding: 12px; font-size: 14px; box-sizing: border-box; margin-bottom: 15px; }
        .settings { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .settings label { width: 110px; font-size: 14px; }
        select, input[type="file"] { padding: 8px; border-radius: 5px; border: 1px solid #ddd; flex-grow: 1; }
        .image-preview-container { display: none; text-align: center; margin-bottom: 15px; position: relative; }
        .image-preview-container img { max-width: 100%; max-height: 180px; border-radius: 8px; border: 1px solid #ddd; }
        .btn-remove-img { background: #dc3545; color: white; border: none; padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; margin-top: 5px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-print { background: #28a745; color: white; grid-column: span 2; font-size: 16px; }
        .btn-print:hover { background: #218838; }
        .btn-feed { background: #6c757d; color: white; }
        .btn-clear { background: #dc3545; color: white; }
        .status { margin-top: 20px; font-size: 13px; color: #666; text-align: center; border-top: 1px solid #eee; padding-top: 10px; }
        canvas { display: none; }
    </style>
</head>
<body>

<div class="printer-card">
    <h2>Right Point Printer</h2>
    
    <div class="header-info">
        <strong>Default Header:</strong><br>
        Right Point, Kewatkhali Bazar, Mosjid Oposit, Sadar, Mymensingh
    </div>

    <textarea id="smsInput" placeholder="এখানে লিখুন (বাংলা/English)..."></textarea>
    
    <!-- ইমেজ সিলেক্ট করার অপশন -->
    <div class="settings">
        <label>ছবি নির্বাচন:</label>
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
    </div>

    <!-- ইমেজ প্রিভিউ এলাকা -->
    <div id="imagePreviewContainer" class="image-preview-container">
        <img id="imagePreview" alt="Image Preview">
        <br>
        <button type="button" class="btn-remove-img" onclick="removeImage()">ছবি সরান</button>
    </div>

    <div class="settings">
        <label>ফন্ট সাইজ:</label>
        <select id="fontSize">
            <option value="0">Normal (ছোট)</option>
            <option value="16">Medium (মাঝারি)</option>
            <option value="32">Large (বড়)</option>
            <option value="48">Extra Large (খুব বড়)</option>
        </select>
    </div>

    <div class="settings">
        <label>কালির ঘনত্ব/Darkness:</label>
        <select id="printDensity">
            <option value="0">Normal (সাধারণ)</option>
            <option value="2">Medium Dark (মাঝারি কালো)</option>
            <option value="4" selected>Dark (গাড় কালো - পুরোনো পেপারের জন্য)</option>
            <option value="8">Extra Dark (সর্বোচ্চ কালো)</option>
        </select>
    </div>

    <div class="settings">
        <label>প্রিন্টিং স্পিড:</label>
        <select id="printSpeed">
            <option value="0">Slow (ধীরে - স্পষ্ট প্রিন্ট)</option>
            <option value="1" selected>Medium (মাঝারি)</option>
            <option value="2">Fast (দ্রুত)</option>
        </select>
    </div>

    <div class="btn-group">
        <button class="btn-print" onclick="handlePrint()">🖨️ প্রিন্ট করুন</button>
        <button class="btn-feed" onclick="sendAction('feed')">কাগজ বের করুন</button>
        <button class="btn-clear" onclick="clearText()">মুছে ফেলুন</button>
    </div>

    <div id="status" class="status">প্রিন্টার সংযুক্ত নেই</div>
    <canvas id="printCanvas"></canvas>
</div>

<script>
let printerCharacteristic = null;
const COMMON_SERVICES = [
    '0000ff00-0000-1000-8000-00805f9b34fb',
    '000018f0-0000-1000-8000-00805f9b34fb',
    '49535343-fe7d-4ae5-8fa9-9fafd205e455'
];

function getCurrentDateTime() {
    const now = new Date();
    const options = { day: '2-digit', month: 'short', year: '2-digit', hour: '2-digit', minute: '2-digit', hour12: true };
    return now.toLocaleString('en-GB', options).replace(',', '');
}

// বাংলা অক্ষর আছে কি না চেক করার ফাংশন
function hasBangla(text) {
    return /[\u0980-\u09FF]/.test(text);
}

// ছবি প্রিভিউ দেখানোর ফাংশন
function previewImage(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('imagePreview').src = e.target.result;
            document.getElementById('imagePreviewContainer').style.display = 'block';
        }
        reader.readAsDataURL(file);
    }
}

// সিলেক্ট করা ছবি সরানোর ফাংশন
function removeImage() {
    document.getElementById('imageInput').value = '';
    document.getElementById('imagePreview').src = '';
    document.getElementById('imagePreviewContainer').style.display = 'none';
}

async function connectPrinter() {
    try {
        updateStatus("প্রিন্টার খোঁজা হচ্ছে...");
        const device = await navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: '581PW' }, { namePrefix: 'Deli' }, { namePrefix: 'Printer' }],
            optionalServices: COMMON_SERVICES
        });
        const server = await device.gatt.connect();
        for (const uuid of COMMON_SERVICES) {
            try {
                const service = await server.getPrimaryService(uuid);
                const chars = await service.getCharacteristics();
                printerCharacteristic = chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
                if (printerCharacteristic) break;
            } catch (e) { continue; }
        }
        if (printerCharacteristic) {
            updateStatus("সংযুক্ত: " + device.name);
            return true;
        }
        throw new Error("সার্ভিস পাওয়া যায়নি");
    } catch (error) {
        updateStatus("ভুল: " + error.message);
        return false;
    }
}

function textToBitmap(text, fontSizeVal) {
    const canvas = document.getElementById('printCanvas');
    const ctx = canvas.getContext('2d');
    const width = 384; 
    // ইমেজের জন্য ফন্ট সাইজ অ্যাডজাস্টমেন্ট
    let fs = fontSizeVal === 0 ? 24 : (fontSizeVal === 16 ? 32 : (fontSizeVal === 32 ? 42 : 55));
    
    ctx.font = `bold ${fs}px Arial, sans-serif`;
    const lines = [];
    let currentLine = "";
    const words = text.split(""); 
    for (let i = 0; i < words.length; i++) {
        let testLine = currentLine + words[i];
        if (ctx.measureText(testLine).width > width) {
            lines.push(currentLine); currentLine = words[i];
        } else { currentLine = testLine; }
    }
    lines.push(currentLine);
    canvas.width = width;
    canvas.height = lines.length * (fs + 10) + 10;
    ctx.fillStyle = "white"; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "black"; ctx.font = `bold ${fs}px Arial, sans-serif`; ctx.textBaseline = "top";
    lines.forEach((l, i) => ctx.fillText(l, 0, i * (fs + 10)));

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const pixels = imageData.data;
    const bitmap = [];
    for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width / 8; x++) {
            let byte = 0;
            for (let bit = 0; bit < 8; bit++) {
                if (pixels[((y * canvas.width) + (x * 8) + bit) * 4] < 128) byte |= (0x80 >> bit);
            }
            bitmap.push(byte);
        }
    }
    return { data: bitmap, width: canvas.width / 8, height: canvas.height };
}

// সিলেক্ট করা ফাইল থেকে বিটম্যাপ তৈরি করার ফাংশন
function processImageToBitmap(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.getElementById('printCanvas');
                const ctx = canvas.getContext('2d');
                const targetWidth = 384; // 58mm প্রিন্টারের পিক্সেল উইডথ
                const scale = targetWidth / img.width;
                const targetHeight = Math.round(img.height * scale);

                canvas.width = targetWidth;
                canvas.height = targetHeight;

                ctx.fillStyle = "white";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, targetWidth, targetHeight);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const pixels = imageData.data;
                const bitmap = [];

                for (let y = 0; y < canvas.height; y++) {
                    for (let x = 0; x < canvas.width / 8; x++) {
                        let byte = 0;
                        for (let bit = 0; bit < 8; bit++) {
                            const pxIndex = ((y * canvas.width) + (x * 8) + bit) * 4;
                            const r = pixels[pxIndex];
                            const g = pixels[pxIndex + 1];
                            const b = pixels[pxIndex + 2];
                            const avg = (r + g + b) / 3;
                            if (avg < 128) {
                                byte |= (0x80 >> bit);
                            }
                        }
                        bitmap.push(byte);
                    }
                }
                resolve({ data: bitmap, width: canvas.width / 8, height: canvas.height });
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

async function handlePrint() {
    const smsBody = document.getElementById('smsInput').value;
    const fontSizeValue = parseInt(document.getElementById('fontSize').value);
    const printDensityValue = parseInt(document.getElementById('printDensity').value);
    const printSpeedValue = parseInt(document.getElementById('printSpeed').value);
    const imageFile = document.getElementById('imageInput').files[0];

    if (!smsBody && !imageFile) return alert("কিছু লিখুন অথবা একটি ছবি সিলেক্ট করুন!");

    if (!printerCharacteristic) {
        if (!(await connectPrinter())) return;
    }

    try {
        updateStatus("প্রিন্ট হচ্ছে...");
        const encoder = new TextEncoder();
        const header = `Right Point\nKewatkhali Bazar, Mosjid Oposit, Sadar, Mymensingh-01724571114\nDate & Time: ${getCurrentDateTime()}\n--------------------------------\n`;
        
        // কালির ঘনত্ব (Density) এবং প্রিন্টিং স্পিড (Speed) কমান্ড সেটআপ
        const configCmds = [
            0x1b, 0x40,                         // Initialize printer
            0x1d, 0x7c, printDensityValue,      // Set Print Density
            0x1b, 0x73, printSpeedValue          // Set Print Speed
        ];

        let payloadBytes = [...configCmds, ...encoder.encode(header)];

        // টেক্সট থাকলে তা প্রসেস করা
        if (smsBody) {
            if (hasBangla(smsBody)) {
                const textBitmap = textToBitmap(smsBody, fontSizeValue);
                const textBitmapHeader = [0x1d, 0x76, 0x30, 0x00, textBitmap.width & 0xff, (textBitmap.width >> 8) & 0xff, textBitmap.height & 0xff, (textBitmap.height >> 8) & 0xff];
                payloadBytes.push(...textBitmapHeader, ...textBitmap.data, 0x0a);
            } else {
                payloadBytes.push(0x1d, 0x21, fontSizeValue, ...encoder.encode(smsBody + "\n"));
            }
        }

        // ছবি সিলেক্ট করা থাকলে তা প্রসেস করে প্রিন্ট ডেটায় যুক্ত করা
        if (imageFile) {
            const imgBitmap = await processImageToBitmap(imageFile);
            const imgBitmapHeader = [0x1d, 0x76, 0x30, 0x00, imgBitmap.width & 0xff, (imgBitmap.width >> 8) & 0xff, imgBitmap.height & 0xff, (imgBitmap.height >> 8) & 0xff];
            payloadBytes.push(...imgBitmapHeader, ...imgBitmap.data, 0x0a);
        }

        // শেষে কয়েক লাইন ফীড দেওয়া
        payloadBytes.push(0x0a, 0x0a, 0x0a, 0x0a);

        const printData = new Uint8Array(payloadBytes);

        const CHUNK_SIZE = 64; 
        for (let i = 0; i < printData.length; i += CHUNK_SIZE) {
            await printerCharacteristic.writeValue(printData.slice(i, i + CHUNK_SIZE));
            await new Promise(r => setTimeout(r, 10)); 
        }
        updateStatus("প্রিন্ট সম্পন্ন!");
    } catch (error) {
        updateStatus("ব্যর্থ: " + error);
        printerCharacteristic = null;
    }
}

async function sendAction(type) {
    if (!printerCharacteristic && !(await connectPrinter())) return;
    if (type === 'feed') await printerCharacteristic.writeValue(new Uint8Array([0x0a, 0x0a, 0x0a]));
}

function clearText() { 
    document.getElementById('smsInput').value = ""; 
    removeImage();
    updateStatus("ক্লিয়ার করা হয়েছে"); 
}

function updateStatus(msg) { document.getElementById('status').innerText = msg; }
</script>
</body>
</html>
